name: swe_baseline_agent
model: gemma-4-e4b-it-qat-w4a16-ct
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
# Edits go through the line-edit skill: in our profiled runs edit_file failed 38%
# of the time because the model could not reproduce old_string exactly.
skills:
  - skills/line-edit
generate_content_config: !include configs/sampling.yaml
