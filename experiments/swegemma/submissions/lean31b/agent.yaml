name: swe_lean_agent
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include prompts/system.md
# Graph tools and the analyzer sub-agent are left out: in our profiled runs two of
# the three graph tools were almost never called, and every extra call costs time
# on a 12-hour scoring budget.
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
generate_content_config: !include configs/sampling.yaml
